<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Se Connecter</title>
    <link rel="stylesheet" href="../static/css/login.css">
</head>
<body>
    <div class="center">

        <div class="background-blur"></div>

        <img src="{{ url_for('static', filename='Blokus.png.tiff') }}" alt="Blokus logo" class="image_logo">

        <div class="form-wrapper">
            <form action="/rejoindre_partie" method="post">
                <label for="username">Identifiant Joueur :</label>
                <input type="text" id="username" name="username" placeholder="Entrez votre identifiant" required>
                
                <label for="ID_Partie">numéro partie :</label>
                <input type="ID_partie" id="ID_partie" name="ID_partie" placeholder="Entrez le numéro de partie" required>
                
                <div class="button-wrapper">
                    <input type="submit" value="Rejoindre" class="submit-button" >
                </div>
            </form>
        </div>
    </div>
</body>
</html>
