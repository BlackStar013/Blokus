<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer un Compte</title>
    <link rel="stylesheet" href="../static/css/signin.css">
</head>
<body>
    <!-- Conteneur principal -->
    <div class="center">
        <!-- Arrière-plan flouté -->
        <div class="background-blur"></div>
        
        <!-- Logo -->
        <img src="{{ url_for('static', filename='Blokus.png.tiff') }}" alt="Blokus logo" class="image_logo">
        
        <!-- Formulaire de création de compte -->
        <div class="form-wrapper">
            <form action="/créer_partie" method="POST">
                <label for="username">Identifiant :</label>
                <input type="text" id="username" name="username" placeholder="Entrez votre identifiant" required>
                
                <label for="nb_joueur">Nombre de joueur :</label>
                <input type="nb_joueur" id="nb_joueur" name="nb_joueur" placeholder="Entrez le nombre de joueur" required>
                
                <label for="nb_IA">Nombre d'IA :</label>
                <input type="nb_IA" id="nb_IA" name="nb_IA" placeholder="Entrez le nombre d'IA" required>
                
                <div class="button-wrapper">
                    <input type="submit" value="Créer une partie" class="submit-button">
                </div>
            </form>
        </div>
    </div>
</body>
</html>
